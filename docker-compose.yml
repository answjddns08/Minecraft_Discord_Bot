version: "3.8"

services:
  # Discord Bot (Web API 포함)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: mc-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # Web API 포트
    env_file:
      - ./bot/.env
    environment: # DISCORD_TOKEN, DISCORD_CLIENT_ID 도 있어야 함(또는 .env 파일에 추가)
      - ENABLE_WEB_SERVER=true
      - WEB_SERVER_PORT=3000
    volumes:
      - ./bot:/app
      - /home/redeyes/Documents/mc-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mc-network
    depends_on:
      - minecraft

  # Minecraft Server
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile.minecraft
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "25575:25575"
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "2G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: 0808
      RCON_PORT: 25575
    volumes:
      - /home/redeyes/Documents/mc-data:/data
    networks:
      - mc-network

networks:
  mc-network:
    driver: bridge
