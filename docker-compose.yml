services:
  # Discord Bot 서비스
  discord-bot:
    build: .
    container_name: minecraft-discord-bot
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    volumes:
      # 설정 파일들
      - ./config.json:/app/config.json
      - ./worldSettings.json:/app/worldSettings.json
      # 마인크래프트 데이터 (모든 데이터를 하나의 마운트에)
      - /home/redeyes/Documents/mc-data:/minecraft
      # 로그 저장
      - ./logs:/app/logs
      # Docker 소켓 (봇이 서버 컨테이너 제어용)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - minecraft-server
    networks:
      - minecraft-network
    restart: unless-stopped

  # Discord Bot 개발용 서비스 (소스 마운트 + nodemon)
  discord-bot-dev:
    image: node:20-alpine
    container_name: minecraft-discord-bot-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    command: sh -c "apk add --no-cache docker-cli && npm install && npx nodemon index.js"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      # 마인크래프트 데이터 (모든 데이터를 하나의 마운트에)
      - /home/redeyes/Documents/mc-data:/minecraft
    depends_on:
      - minecraft-server
    networks:
      - minecraft-network
    restart: unless-stopped
    profiles:
      - dev

  # Minecraft 서버
  minecraft-server:
    image: itzg/minecraft-server:java21
    container_name: minecraft-server
    environment:
      # 기본 설정
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"

      # 서버 설정
      SERVER_NAME: "Minecraft Server"
      MOTD: "Minecraft Server managed by Discord Bot"
      MAX_PLAYERS: 10

      # 메모리 설정
      MEMORY: "2G"

      # RCON 설정 (봇이 서버 제어를 위해 필요)
      ENABLE_RCON: "true"
      RCON_PASSWORD: "0808"
      RCON_PORT: 25575

      # 월드 설정
      LEVEL: "world"

      # 성능 최적화
      USE_AIKAR_FLAGS: "true"
      ENABLE_ROLLING_LOGS: "true"

    ports:
      - "25565:25565" # Minecraft 포트
    volumes:
      # 서버 데이터 저장 (모든 데이터를 하나의 마운트에)
      - /home/redeyes/Documents/mc-data/server:/data
    networks:
      - minecraft-network

networks:
  minecraft-network:
    driver: bridge
volumes:
  node_modules:
    driver: local
