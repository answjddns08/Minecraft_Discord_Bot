services:
  # Discord Bot 서비스
  discord-bot:
    build: .
    container_name: minecraft-discord-bot
    network_mode: host
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    volumes:
      # 설정 파일들
      - ./config.json:/app/config.json
      - ./worldSettings.json:/app/worldSettings.json
      # 마인크래프트 데이터 (모든 데이터를 하나의 마운트에)
      - /home/redeyes/Documents/mc-data:/minecraft
      # 로그 저장
      - ./logs:/app/logs
      # Docker 소켓 (봇이 서버 컨테이너 제어용)
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Discord Bot 개발용 서비스 (소스 마운트 + nodemon)
  discord-bot-dev:
    image: node:20-alpine
    container_name: minecraft-discord-bot-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    command: sh -c "apk add --no-cache docker-cli && npm install && npx nodemon index.js"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      # Docker 소켓 (봇이 서버 컨테이너 제어용)
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      # 마인크래프트 데이터 (모든 데이터를 하나의 마운트에)
      - /home/redeyes/Documents/mc-data:/minecraft
    networks:
      - minecraft-network
    restart: unless-stopped
    profiles:
      - dev

  # Minecraft 서버 (커스텀 이미지)
  minecraft-server:
    build:
      context: .
      dockerfile: Dockerfile.minecraft
    container_name: minecraft-server
    environment:
      # 버전 설정 (기본: LATEST)
      VERSION: "${MC_VERSION:-LATEST}"

      # 월드 설정
      LEVEL: "${MC_LEVEL:-world}"

      # 메모리 설정
      MEMORY: "2G"

      EULA: "true"

    profiles:
      - server

    ports:
      - "25565:25565" # Minecraft 포트
      - "25575:25575" # RCON 포트

    volumes:
      # 서버 데이터 저장
      - /home/redeyes/Documents/mc-data/server:/data
      # 월드 설정 파일
      - /home/redeyes/Documents/MC_bot/worldSettings.json:/config/worldSettings.json:ro

    networks:
      - minecraft-network

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 2G

networks:
  minecraft-network:
    driver: bridge
volumes:
  node_modules:
    driver: local
